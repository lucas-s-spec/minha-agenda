<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Processando autorização...</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <p>Conectando ao Google Agenda... Esta janela fechará em instantes.</p>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');

    if (token) {
      if (window.opener) {
        window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', token: token }, '*');
      }
      setTimeout(() => window.close(), 500);
    } else {
      document.body.innerHTML = '<p>Erro na autorização ou token não retornado. Pode fechar esta janela.</p>';
    }
  </script>
</body>
</html>
