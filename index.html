<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" />

  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 10px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* Hero Banner idêntico ao FastCorte */
    .hero-card {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-card h2 {
      font-size: 14px;
      font-weight: 700;
    }

    .hero-card p {
      font-size: 11px;
      opacity: 0.9;
      line-height: 1.3;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .hero-badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px);
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }

    .hero-badge span:first-child {
      font-size: 9px;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 600;
    }

    .hero-badge span:last-child {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Abas */
    .tabs {
      display: flex;
      background: #e2e8f0;
      padding: 2px;
      border-radius: 8px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-main);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .field-row {
      display: flex;
      gap: 6px;
    }

    label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select, textarea {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
      width: 100%;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-light);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-outline {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 3px 6px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .event-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 11px;
    }

    .event-meta {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .event-actions {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }

    .action-btn {
      flex: 1;
      padding: 4px;
      font-size: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
  </style>
</head>
<body>

  <div class="wrapper" id="root">
    <!-- Hero Card -->
    <div class="hero-card">
      <h2>Minha Agenda</h2>
      <p>Gerenciador de agendamentos e reuniões.</p>
      <div class="hero-grid">
        <div class="hero-badge">
          <span>SDK</span>
          <span id="sdkLabel">Conectado</span>
        </div>
        <div class="hero-badge">
          <span>Cliente</span>
          <span id="chatStatus">Aguardando...</span>
        </div>
      </div>
    </div>

    <!-- Navegação -->
    <div class="tabs">
      <button class="tab-btn active" id="tabNewBtn" onclick="switchTab('new')">
        <span class="material-symbols-outlined" style="font-size:15px;">add</span> Agendar
      </button>
      <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">
        <span class="material-symbols-outlined" style="font-size:15px;">list_alt</span> Marcados (<span id="eventCount">0</span>)
      </button>
    </div>

    <!-- Tab Novo -->
    <div id="tabNewContent">
      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <span class="material-symbols-outlined" style="font-size:16px;">person</span>
            Contato
          </span>
          <button type="button" class="btn-outline" onclick="useClientData()">Puxar do Chat</button>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Nome</label>
            <input type="text" id="clientName" placeholder="Nome do cliente" />
          </div>
          <div class="field-group">
            <label>Telefone</label>
            <input type="text" id="clientPhone" placeholder="DDD + Número" />
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: 8px;">
        <div class="card-header">
          <span class="card-title">
            <span class="material-symbols-outlined" style="font-size:16px;">event</span>
            Horário
          </span>
        </div>

        <form id="appointmentForm">
          <div class="field-group" style="margin-bottom: 6px;">
            <label>Título</label>
            <input type="text" id="title" placeholder="Ex: Demonstração / Reunião" required />
          </div>

          <div class="field-row" style="margin-bottom: 6px;">
            <div class="field-group">
              <label>Data</label>
              <input type="date" id="date" required />
            </div>
            <div class="field-group">
              <label>Hora</label>
              <input type="time" id="time" required />
            </div>
            <div class="field-group">
              <label>Tempo</label>
              <select id="duration">
                <option value="30">30m</option>
                <option value="45">45m</option>
                <option value="60">1h</option>
              </select>
            </div>
          </div>

          <div class="field-group" style="margin-bottom: 10px;">
            <label>Observações / Meet</label>
            <textarea id="notes" rows="2" placeholder="Link da sala ou detalhes"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">
            <span class="material-symbols-outlined" style="font-size:16px;">save</span>
            Salvar e Confirmar
          </button>
        </form>
      </div>
    </div>

    <!-- Tab Lista -->
    <div id="tabListContent" style="display: none;">
      <div id="agendaList"></div>
    </div>
  </div>

  <script>
    let activeClient = { name: '', phone: '' };
    let appointments = JSON.parse(localStorage.getItem("agenda_events") || "[]");

    // Forçar o scroll do iframe para o topo sempre ao carregar
    window.scrollTo(0, 0);

    // Comunicação com o AtenderBem
    function notifyPlatform() {
      const h = document.body.scrollHeight || document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "RESIZE", height: h }, "*");
      window.parent.postMessage({ type: "SET_HEIGHT", height: h }, "*");
      window.parent.postMessage({ type: "size", height: h }, "*");
    }

    window.addEventListener("message", (event) => {
      const { type, data } = event.data || {};
      if (type === "CHAT_SELECTED" || type === "CONTACT_LOADED" || type === "ON_CHAT_OPEN") {
        activeClient.name = data?.name || data?.contact?.name || "";
        activeClient.phone = data?.phone || data?.contact?.phone || "";

        if (activeClient.name) {
          document.getElementById("chatStatus").innerText = activeClient.name.split(" ")[0];
          useClientData();
        }
      }
      notifyPlatform();
    });

    window.parent.postMessage({ type: "EXTENSION_READY" }, "*");
    window.parent.postMessage({ type: "ready" }, "*");

    function useClientData() {
      if (activeClient.name) document.getElementById("clientName").value = activeClient.name;
      if (activeClient.phone) document.getElementById("clientPhone").value = activeClient.phone;
      if (!document.getElementById("title").value && activeClient.name) {
        document.getElementById("title").value = `Reunião - ${activeClient.name}`;
      }
    }

    const initDate = () => {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      document.getElementById("date").value = d.toISOString().split('T')[0];
      document.getElementById("time").value = "14:00";
    };
    initDate();

    function switchTab(tab) {
      if (tab === 'new') {
        document.getElementById("tabNewBtn").classList.add("active");
        document.getElementById("tabListBtn").classList.remove("active");
        document.getElementById("tabNewContent").style.display = "block";
        document.getElementById("tabListContent").style.display = "none";
      } else {
        document.getElementById("tabNewBtn").classList.remove("active");
        document.getElementById("tabListBtn").classList.add("active");
        document.getElementById("tabNewContent").style.display = "none";
        document.getElementById("tabListContent").style.display = "block";
        renderList();
      }
      window.scrollTo(0, 0);
      notifyPlatform();
    }

    document.getElementById("appointmentForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const newEvent = {
        id: Date.now(),
        title: document.getElementById("title").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        duration: document.getElementById("duration").value,
        clientName: document.getElementById("clientName").value || "Cliente",
        clientPhone: document.getElementById("clientPhone").value || "",
        notes: document.getElementById("notes").value || ""
      };

      appointments.unshift(newEvent);
      localStorage.setItem("agenda_events", JSON.stringify(appointments));
      updateCount();

      sendChatConfirmation(newEvent);
      switchTab('list');
    });

    function renderList() {
      const container = document.getElementById("agendaList");
      updateCount();

      if (appointments.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color:#94a3b8; font-size:11px;">Nenhum compromisso marcado.</div>`;
        return;
      }

      container.innerHTML = appointments.map(item => {
        const [yyyy, mm, dd] = item.date.split('-');
        return `
          <div class="event-card">
            <div class="event-card-header">
              <span>${item.title}</span>
              <span style="color:#1e40af;">${item.duration}m</span>
            </div>
            <div class="event-meta">
              <span>🗓 ${dd}/${mm}/${yyyy} às ${item.time}</span>
              <span>👤 ${item.clientName} ${item.clientPhone ? '(' + item.clientPhone + ')' : ''}</span>
              ${item.notes ? `<span>📝 ${item.notes}</span>` : ''}
            </div>
            <div class="event-actions">
              <button class="action-btn" onclick="sendChatConfirmationById(${item.id})">💬 Chat</button>
              <button class="action-btn" onclick="openGoogleCalendarById(${item.id})">📅 Google</button>
              <button class="action-btn" style="color:#ef4444;" onclick="deleteAppointment(${item.id})">🗑</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCount() {
      document.getElementById("eventCount").innerText = appointments.length;
    }

    function deleteAppointment(id) {
      if (confirm("Deseja cancelar este agendamento?")) {
        appointments = appointments.filter(a => a.id !== id);
        localStorage.setItem("agenda_events", JSON.stringify(appointments));
        renderList();
      }
    }

    function sendChatConfirmation(item) {
      const [yyyy, mm, dd] = item.date.split('-');
      const text = `📅 *Confirmação de Agendamento*\n\nOlá, ${item.clientName}!\nSeu horário para *${item.title}* está marcado:\n🗓 Data: *${dd}/${mm}/${yyyy}*\n⏰ Horário: *${item.time}*\n\nQualquer imprevisto nos avise!`;
      window.parent.postMessage({ type: "INSERT_MESSAGE", text: text }, "*");
    }

    function sendChatConfirmationById(id) {
      const item = appointments.find(a => a.id === id);
      if (item) sendChatConfirmation(item);
    }

    function openGoogleCalendarById(id) {
      const item = appointments.find(a => a.id === id);
      if (!item) return;

      const start = new Date(`${item.date}T${item.time}:00`);
      const end = new Date(start.getTime() + parseInt(item.duration, 10) * 60000);
      const format = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');

      const dates = `${format(start)}/${format(end)}`;
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.title)}&dates=${dates}&details=${encodeURIComponent(item.notes || '')}`;
      window.open(url, "_blank");
    }

    updateCount();
  </script>
</body>
</html>
