<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda Pessoal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--ext-color-bg, #f8fafc);
      color: var(--ext-color-text, #172033);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      padding: 12px;
      overflow-x: hidden;
    }
    :root {
      --primary: var(--ext-color-primary, #1458ea);
      --primary-light: var(--ext-color-primary-light, #e8f0ff);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --muted: #64748b;
      --border: #dbe3ef;
      --card: #ffffff;
      --soft: #f1f5f9;
      --dark: #0f172a;
    }
    .app { width: 100%; max-width: 100%; }
    .hero {
      background: linear-gradient(135deg, var(--primary), #29bdff);
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 18px rgba(20, 88, 234, .18);
    }
    .hero h1 { font-size: 16px; margin: 0 0 4px; }
    .hero p { margin: 0; opacity: .92; font-size: 11px; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .status-chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 8px; padding: 7px; }
    .status-chip b { display: block; font-size: 10px; opacity: .8; text-transform: uppercase; }
    .status-chip span { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    .card-title { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--primary); font-weight: 800; margin-bottom: 9px; font-size: 14px; }
    .small { color: var(--muted); font-size: 11px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
    .row:last-child { border-bottom: 0; }
    .label { color: var(--muted); font-weight: 600; }
    .value { color: #0f172a; font-weight: 800; text-align: right; overflow-wrap: anywhere; }
    .notice { border-radius: 8px; padding: 9px; margin: 8px 0; font-size: 11px; }
    .notice.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .notice.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .notice.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    button, select, input, textarea { font-family: inherit; }
    .btn { width: 100%; min-height: 36px; border: 0; border-radius: 8px; color: white; background: var(--primary); font-weight: 800; font-size: 12px; cursor: pointer; padding: 8px 9px; }
    .btn:hover { filter: brightness(.96); }
    .btn.secondary { background: #475569; }
    .btn.success { background: var(--success); }
    .btn.warn { background: var(--warning); }
    .btn.danger { background: var(--danger); }
    .btn.outline { color: var(--primary); background: white; border: 1px solid var(--primary); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #e2e8f0; padding: 3px; border-radius: 8px; margin-bottom: 12px; gap: 4px; }
    .tab-btn { border: 0; background: transparent; padding: 7px; font-weight: 800; font-size: 12px; color: var(--muted); border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; background: white; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    .event-item { background: var(--soft); border-left: 4px solid var(--primary); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .event-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 4px; }
    .event-meta { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .event-btns { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 8px; }
    .mini-btn { border: 1px solid var(--border); background: white; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 4px; cursor: pointer; }
    .mini-btn.del { color: var(--danger); border-color: #fecaca; }
    .footer-space { height: 40px; }
  </style>
</head>
<body>

<div class="app" id="app">
  <section class="hero">
    <h1>Minha Agenda Pessoal</h1>
    <p>Agendamento de reuniões e consultas sincronizado com o Google Calendar.</p>
    <div class="status-grid">
      <div class="status-chip"><b>SDK</b><span id="sdk-state">Inicializando</span></div>
      <div class="status-chip"><b>Chat</b><span id="chat-state">Aguardando</span></div>
      <div class="status-chip"><b>Agendados</b><span id="count-state">0 marcados</span></div>
      <div class="status-chip"><b>Google Meet</b><span>Disponível</span></div>
    </div>
  </section>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabNewBtn" onclick="switchTab('new')">Novo Agendamento</button>
    <button type="button" class="tab-btn" id="tabListBtn" onclick="switchTab('list')">Compromissos (<span id="tabCount">0</span>)</button>
  </div>

  <div id="tabNewContent">
    <section class="card">
      <div class="card-title">
        <span>👤 Cliente do Chat</span>
        <button type="button" class="btn outline" style="width:auto;min-height:26px;padding:2px 8px;font-size:11px" onclick="fillCurrentClient()">Puxar Dados</button>
      </div>
      <div class="row"><span class="label">Nome</span><span class="value" id="cust-name">-</span></div>
      <div class="row"><span class="label">Telefone</span><span class="value" id="cust-phone">-</span></div>
      <div class="row"><span class="label">Chat ID</span><span class="value" id="chat-id">-</span></div>
    </section>

    <section class="card">
      <div class="card-title"><span>📅 Detalhes do Horário</span></div>
      <form id="scheduleForm">
        <div class="field-group">
          <label>Título da Reunião</label>
          <input type="text" id="eventTitle" placeholder="Ex: Demonstração / Consulta" required>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Data</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="field-group">
            <label>Horário</label>
            <input type="time" id="eventTime" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Duração</label>
            <select id="eventDuration">
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="45">45 min</option>
              <option value="60">1 hora</option>
            </select>
          </div>
          <div class="field-group">
            <label>E-mail Convidado</label>
            <input type="email" id="eventEmail" placeholder="cliente@email.com">
          </div>
        </div>

        <div class="field-group">
          <label>Pauta / Observações</label>
          <textarea id="eventNotes" rows="2" placeholder="Link da videochamada ou pauta"></textarea>
        </div>

        <button type="submit" class="btn success" style="margin-top:6px">Salvar Compromisso</button>
      </form>
    </section>
  </div>

  <div id="tabListContent" style="display:none">
    <section class="card">
      <div class="card-title"><span>📋 Lista de Compromissos</span></div>
      <div id="eventsList"></div>
    </section>
  </div>

  <div class="footer-space"></div>
</div>

<script>
  const state = {
    hasOmni: typeof window.omni !== 'undefined',
    ready: false,
    chat: null,
    appointments: JSON.parse(localStorage.getItem("agenda_events") || "[]")
  };

  const $ = (id) => document.getElementById(id);

  // Redimensionador idêntico ao da FastCorte para expandir o iframe pai
  function resizeHost() {
    if (!state.hasOmni || !omni.ui || !omni.ui.resize) return;
    requestAnimationFrame(() => {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        $('app')?.scrollHeight || 0,
        760
      );
      omni.ui.resize(height + 24).catch(() => {});
    });
  }

  function scheduleResize() {
    resizeHost();
    setTimeout(resizeHost, 200);
    setTimeout(resizeHost, 800);
  }

  function renderCustomer() {
    const chat = state.chat;
    $('chat-state').textContent = chat?.id ? `#${chat.id}` : 'Sem chat';
    $('cust-name').textContent = chat?.contact?.name || chat?.clientName || chat?.name || 'Não identificado';
    $('cust-phone').textContent = chat?.contact?.phone || chat?.phone || chat?.clientNumber || '-';
    $('chat-id').textContent = chat?.id || '-';
  }

  function fillCurrentClient() {
    const name = $('cust-name').textContent;
    if (name && name !== 'Não identificado' && name !== '-') {
      $('eventTitle').value = `Reunião - ${name}`;
    }
  }

  async function refreshChat() {
    if (!state.hasOmni) {
      state.chat = { id: 101, contact: { name: 'Lucas Teste', phone: '(38) 99999-9999' } };
      renderCustomer();
      return;
    }
    try {
      const chat = await omni.chats.getSelected();
      state.chat = chat || null;
      renderCustomer();
      fillCurrentClient();
    } catch (err) {
      console.error(err);
    }
  }

  function switchTab(tab) {
    if (tab === 'new') {
      $('tabNewBtn').classList.add('active');
      $('tabListBtn').classList.remove('active');
      $('tabNewContent').style.display = 'block';
      $('tabListContent').style.display = 'none';
    } else {
      $('tabNewBtn').classList.remove('active');
      $('tabListBtn').classList.add('active');
      $('tabNewContent').style.display = 'none';
      $('tabListContent').style.display = 'block';
      renderAppointments();
    }
    scheduleResize();
  }

  function updateCounts() {
    const count = state.appointments.length;
    $('count-state').textContent = `${count} marcado(s)`;
    $('tabCount').textContent = count;
  }

  function renderAppointments() {
    const container = $('eventsList');
    if (!state.appointments.length) {
      container.innerHTML = '<div class="notice info">Nenhum compromisso marcado até o momento.</div>';
      return;
    }

    container.innerHTML = state.appointments.map(ev => {
      const [y, m, d] = ev.date.split('-');
      return `
        <div class="event-item">
          <div class="event-header">
            <span>${ev.title}</span>
            <span style="color:var(--primary)">${ev.duration}m</span>
          </div>
          <div class="event-meta">
            <div>🗓 ${d}/${m}/${y} às <b>${ev.time}</b></div>
            <div>👤 ${ev.clientName} · ${ev.clientPhone}</div>
            ${ev.notes ? `<div>📝 ${ev.notes}</div>` : ''}
          </div>
          <div class="event-btns">
            <button type="button" class="mini-btn" onclick="sendWhatsApp(${ev.id})">💬 Enviar WhatsApp</button>
            <button type="button" class="mini-btn" onclick="openGoogle(${ev.id})">📅 Google Agenda</button>
            <button type="button" class="mini-btn del" onclick="deleteEvent(${ev.id})">✕</button>
          </div>
        </div>
      `;
    }).join('');
    scheduleResize();
  }

  $('scheduleForm').onsubmit = async (e) => {
    e.preventDefault();
    const newEv = {
      id: Date.now(),
      title: $('eventTitle').value,
      date: $('eventDate').value,
      time: $('eventTime').value,
      duration: $('eventDuration').value,
      email: $('eventEmail').value,
      notes: $('eventNotes').value,
      clientName: $('cust-name').textContent,
      clientPhone: $('cust-phone').textContent
    };

    state.appointments.unshift(newEv);
    localStorage.setItem("agenda_events", JSON.stringify(state.appointments));
    updateCounts();

    if (state.hasOmni && omni.ui?.toast) {
      await omni.ui.toast('Agendamento salvo com sucesso!', 'success');
    }

    switchTab('list');
  };

  function deleteEvent(id) {
    state.appointments = state.appointments.filter(x => x.id !== id);
    localStorage.setItem("agenda_events", JSON.stringify(state.appointments));
    updateCounts();
    renderAppointments();
  }

  async function sendWhatsApp(id) {
    const ev = state.appointments.find(x => x.id === id);
    if (!ev) return;

    const [y, m, d] = ev.date.split('-');
    const msg = `📅 *Agendamento Confirmado!*\n\nOlá, ${ev.clientName}!\nSeu horário para *${ev.title}* está marcado:\n🗓 *Data:* ${d}/${m}/${y}\n⏰ *Horário:* ${ev.time}\n⏱ *Duração:* ${ev.duration} min\n\nQualquer dúvida, estamos à disposição!`;

    if (state.hasOmni && state.chat?.id) {
      try {
        await omni.chats.sendMessage(Number(state.chat.id), { text: msg });
        if (omni.ui?.toast) await omni.ui.toast('Mensagem enviada no chat!', 'success');
      } catch (err) {
        alert('Erro ao enviar: ' + err.message);
      }
    } else {
      window.parent.postMessage({ type: "INSERT_MESSAGE", text: msg }, "*");
      alert('Texto pronto! Injetado no chat.');
    }
  }

  function openGoogle(id) {
    const ev = state.appointments.find(x => x.id === id);
    if (!ev) return;

    const start = new Date(`${ev.date}T${ev.time}:00`);
    const end = new Date(start.getTime() + parseInt(ev.duration, 10) * 60000);
    const format = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
    const dates = `${format(start)}/${format(end)}`;

    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${dates}&details=${encodeURIComponent(ev.notes || '')}&add=${encodeURIComponent(ev.email || '')}`;
    window.open(url, '_blank');
  }

  // Inicialização padrão
  const d = new Date();
  d.setDate(d.getDate() + 1);
  $('eventDate').value = d.toISOString().split('T')[0];
  $('eventTime').value = '14:00';
  updateCounts();

  // Boot Oficial AtenderBem
  async function boot() {
    if (!state.hasOmni) {
      $('sdk-state').textContent = 'Modo isolado';
      await refreshChat();
      scheduleResize();
      return;
    }

    $('sdk-state').textContent = 'Detectado';
    omni.ready(async (context) => {
      state.ready = true;
      $('sdk-state').textContent = 'Conectado';
      omni.on('chatListChanged', refreshChat);
      await refreshChat();
      scheduleResize();
    });
  }

  if ('ResizeObserver' in window) new ResizeObserver(scheduleResize).observe(document.body);
  setInterval(resizeHost, 2000);
  boot();
</script>
</body>
</html>
