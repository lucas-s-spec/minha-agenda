<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Agenda Pessoal</title>
  <!-- Script oficial Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--ext-color-bg, #f8fafc);
      color: var(--ext-color-text, #172033);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      padding: 12px;
      overflow-x: hidden;
    }
    :root {
      --primary: var(--ext-color-primary, #1458ea);
      --primary-light: var(--ext-color-primary-light, #e8f0ff);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --muted: #64748b;
      --border: #dbe3ef;
      --card: #ffffff;
      --soft: #f1f5f9;
      --dark: #0f172a;
    }
    .app { width: 100%; max-width: 100%; }
    .hero {
      background: linear-gradient(135deg, var(--primary), #29bdff);
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 18px rgba(20, 88, 234, .18);
    }
    .hero h1 { font-size: 16px; margin: 0 0 4px; }
    .hero p { margin: 0; opacity: .92; font-size: 11px; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .status-chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 8px; padding: 7px; }
    .status-chip b { display: block; font-size: 10px; opacity: .8; text-transform: uppercase; }
    .status-chip span { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .btn-connect {
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 7px;
      color: white;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-connect:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
    .card-title { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--primary); font-weight: 800; margin-bottom: 9px; font-size: 14px; }
    .small { color: var(--muted); font-size: 11px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
    .row:last-child { border-bottom: 0; }
    .label { color: var(--muted); font-weight: 600; }
    .value { color: #0f172a; font-weight: 800; text-align: right; overflow-wrap: anywhere; }
    .notice { border-radius: 8px; padding: 9px; margin: 8px 0; font-size: 11px; }
    .notice.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    
    button, select, input, textarea { font-family: inherit; }
    .btn { width: 100%; min-height: 36px; border: 0; border-radius: 8px; color: white; background: var(--primary); font-weight: 800; font-size: 12px; cursor: pointer; padding: 8px 9px; }
    .btn:hover { filter: brightness(.96); }
    .btn.success { background: var(--success); }
    .btn.outline { color: var(--primary); background: white; border: 1px solid var(--primary); }
    
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #e2e8f0; padding: 3px; border-radius: 8px; margin-bottom: 12px; gap: 4px; }
    .tab-btn { border: 0; background: transparent; padding: 7px; font-weight: 800; font-size: 12px; color: var(--muted); border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    
    .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; background: white; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .event-item { background: var(--soft); border-left: 4px solid var(--primary); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .event-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 4px; }
    .event-meta { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .event-btns { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 8px; }
    .mini-btn { border: 1px solid var(--border); background: white; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 4px; cursor: pointer; }
    .mini-btn.del { color: var(--danger); border-color: #fecaca; }
    .footer-space { height: 40px; }
  </style>
</head>
<body>

<div class="app" id="app">
  <section class="hero">
    <h1>Minha Agenda Pessoal</h1>
    <p>Agendamento integrado ao AtenderBem e Google Calendar API.</p>
    <div class="status-grid">
      <div class="status-chip"><b>SDK</b><span id="sdk-state">Inicializando</span></div>
      <div class="status-chip"><b>Chat</b><span id="chat-state">Aguardando</span></div>
      
      <button type="button" class="btn-connect" id="btn-gcal-connect" title="Clique para autenticar conta Google">
        <b style="display: block; font-size: 10px; opacity: .9; text-transform: uppercase;">Google Agenda</b>
        <span id="gcal-state" style="display: block; font-weight: 800; font-size: 12px; color: #fef08a;">⚡ Conectar</span>
      </button>

      <div class="status-chip"><b>Agendados</b><span id="count-state">0 marcados</span></div>
    </div>
  </section>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabNewBtn" onclick="switchTab('new')">Novo Agendamento</button>
    <button type="button" class="tab-btn" id="tabListBtn" onclick="switchTab('list')">Compromissos (<span id="tabCount">0</span>)</button>
  </div>

  <div id="tabNewContent">
    <section class="card">
      <div class="card-title">
        <span>👤 Cliente do Chat</span>
        <button type="button" class="btn outline" style="width:auto;min-height:26px;padding:2px 8px;font-size:11px" onclick="fillCurrentClient()">Puxar Dados</button>
      </div>
      <div class="row"><span class="label">Nome</span><span class="value" id="cust-name">-</span></div>
      <div class="row"><span class="label">Telefone</span><span class="value" id="cust-phone">-</span></div>
      <div class="row"><span class="label">Chat ID</span><span class="value" id="chat-id">-</span></div>
    </section>

    <section class="card">
      <div class="card-title"><span>📅 Detalhes do Horário</span></div>
      <form id="scheduleForm">
        <div class="field-group">
          <label>Título da Reunião</label>
          <input type="text" id="eventTitle" placeholder="Ex: Demonstração / Consulta" required>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Data</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="field-group">
            <label>Horário</label>
            <input type="time" id="eventTime" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Duração</label>
            <select id="eventDuration">
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="45">45 min</option>
              <option value="60">1 hora</option>
            </select>
          </div>
          <div class="field-group">
            <label>E-mail Convidado</label>
            <input type="email" id="eventEmail" placeholder="cliente@email.com">
          </div>
        </div>

        <div class="field-group">
          <label>Pauta / Observações</label>
          <textarea id="eventNotes" rows="2" placeholder="Link da videochamada ou pauta"></textarea>
        </div>

        <button type="submit" class="btn success" style="margin-top:6px">Salvar e Sincronizar no Google</button>
      </form>
    </section>
  </div>

  <div id="tabListContent" style="display:none">
    <section class="card">
      <div class="card-title">
        <span>📋 Lista de Compromissos</span>
        <button type="button" class="btn outline" style="width:auto;min-height:26px;padding:2px 8px;font-size:11px" onclick="fetchGoogleEvents()">Buscar do Google</button>
      </div>
      <div id="eventsList"></div>
    </section>
  </div>

  <div class="footer-space"></div>
</div>

<script>
  const GOOGLE_CLIENT_ID = '92440529523-fgo3hm40m24v51mj2u9a1mfs32hki5ca.apps.googleusercontent.com';
  const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/calendar.events';

  let tokenClient = null;
  let googleAccessToken = localStorage.getItem('gcal_token') || null;

  const state = {
    hasOmni: typeof window.omni !== 'undefined',
    ready: false,
    chat: null,
    appointments: JSON.parse(localStorage.getItem('agenda_events') || '[]')
  };

  const $ = (id) => document.getElementById(id);

  function resizeHost() {
    if (!state.hasOmni || !omni.ui || !omni.ui.resize) return;
    requestAnimationFrame(() => {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        $('app')?.scrollHeight || 0,
        760
      );
      omni.ui.resize(height + 24).catch(() => {});
    });
  }

  function scheduleResize() {
    resizeHost();
    setTimeout(resizeHost, 200);
    setTimeout(resizeHost, 800);
  }

  function initGoogleAuth() {
    if (!window.google?.accounts?.oauth2) {
      console.warn('SDK do Google Identity ainda não carregou na memória.');
      return false;
    }
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse?.error) {
            alert('Erro retornado pelo Google: ' + JSON.stringify(tokenResponse));
            return;
          }
          if (tokenResponse?.access_token) {
            googleAccessToken = tokenResponse.access_token;
            localStorage.setItem('gcal_token', googleAccessToken);
            updateGoogleStatus(true);
            if (state.hasOmni && omni.ui?.toast) {
              omni.ui.toast('Google Agenda conectado com sucesso!', 'success');
            } else {
              alert('Google Agenda conectado com sucesso!');
            }
            fetchGoogleEvents();
          }
        }
      });
      return true;
    } catch (e) {
      alert('Erro ao inicializar OAuth: ' + e.message);
      return false;
    }
  }

  function connectGoogleAccount() {
    if (!window.google?.accounts?.oauth2) {
      alert('Atenção: A biblioteca do Google (accounts.google.com/gsi/client) ainda não carregou ou foi bloqueada pela sandbox da plataforma.');
      return;
    }
    if (!tokenClient) {
      const ok = initGoogleAuth();
      if (!ok) return;
    }
    try {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } catch (err) {
      alert('Falha ao abrir popup: ' + err.message);
    }
  }

  function updateGoogleStatus(connected) {
    const el = $('gcal-state');
    if (connected) {
      el.textContent = '✓ Conectado';
      el.style.color = '#86efac';
    } else {
      el.textContent = '⚡ Conectar';
      el.style.color = '#fef08a';
    }
  }

  $('btn-gcal-connect').addEventListener('click', connectGoogleAccount);

  async function pushToGoogleCalendar(appointment) {
    if (!googleAccessToken) return false;

    const startIso = `${appointment.date}T${appointment.time}:00`;
    const startDate = new Date(startIso);
    const endDate = new Date(startDate.getTime() + Number(appointment.duration) * 60000);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const payload = {
      summary: appointment.title,
      description: `${appointment.notes || ''}\n\nCliente: ${appointment.clientName} (${appointment.clientPhone})`,
      start: { dateTime: startDate.toISOString(), timeZone: tz },
      end: { dateTime: endDate.toISOString(), timeZone: tz },
      attendees: appointment.email ? [{ email: appointment.email }] : []
    };

    try {
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${googleAccessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (res.status === 401) {
        googleAccessToken = null;
        localStorage.removeItem('gcal_token');
        updateGoogleStatus(false);
        connectGoogleAccount();
        return false;
      }

      return res.ok;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function fetchGoogleEvents() {
    if (!googleAccessToken) {
      connectGoogleAccount();
      return;
    }

    const now = new Date();
    now.setHours(0, 0, 0, 0);

    const url = new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
    url.searchParams.set('timeMin', now.toISOString());
    url.searchParams.set('singleEvents', 'true');
    url.searchParams.set('orderBy', 'startTime');
    url.searchParams.set('maxResults', '15');

    try {
      const res = await fetch(url.toString(), {
        headers: {
          'Authorization': `Bearer ${googleAccessToken}`,
          'Accept': 'application/json'
        }
      });

      if (res.status === 401) {
        googleAccessToken = null;
        localStorage.removeItem('gcal_token');
        updateGoogleStatus(false);
        return;
      }

      const data = await res.json();
      if (data.items) {
        state.appointments = data.items.map(item => {
          const start = new Date(item.start.dateTime || item.start.date);
          const end = new Date(item.end.dateTime || item.end.date);
          const dur = Math.round((end - start) / 60000) || 30;
          return {
            id: item.id,
            title: item.summary || 'Sem título',
            date: start.toISOString().split('T')[0],
            time: start.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
            duration: dur,
            clientName: 'Google Agenda',
            clientPhone: '-',
            notes: item.description || ''
          };
        });
        localStorage.setItem('agenda_events', JSON.stringify(state.appointments));
        updateCounts();
        renderAppointments();
      }
    } catch (err) {
      console.error('Erro ao buscar eventos:', err);
    }
  }

  function renderCustomer() {
    const chat = state.chat;
    $('chat-state').textContent = chat?.id ? `#${chat.id}` : 'Sem chat';
    $('cust-name').textContent = chat?.contact?.name || chat?.clientName || chat?.name || 'Não identificado';
    $('cust-phone').textContent = chat?.contact?.phone || chat?.phone || chat?.clientNumber || '-';
    $('chat-id').textContent = chat?.id || '-';
  }

  function fillCurrentClient() {
    const name = $('cust-name').textContent;
    if (name && name !== 'Não identificado' && name !== '-') {
      $('eventTitle').value = `Reunião - ${name}`;
    }
  }

  async function refreshChat() {
    if (!state.hasOmni) {
      state.chat = { id: 101, contact: { name: 'Cliente Teste', phone: '(38) 99999-9999' } };
      renderCustomer();
      return;
    }
    try {
      const chat = await omni.chats.getSelected();
      state.chat = chat || null;
      renderCustomer();
      fillCurrentClient();
    } catch (err) {
      console.error(err);
    }
  }

  function switchTab(tab) {
    if (tab === 'new') {
      $('tabNewBtn').classList.add('active');
      $('tabListBtn').classList.remove('active');
      $('tabNewContent').style.display = 'block';
      $('tabListContent').style.display = 'none';
    } else {
      $('tabNewBtn').classList.remove('active');
      $('tabListBtn').classList.add('active');
      $('tabNewContent').style.display = 'none';
      $('tabListContent').style.display = 'block';
      renderAppointments();
    }
    scheduleResize();
  }

  function updateCounts() {
    const count = state.appointments.length;
    $('count-state').textContent = `${count} marcado(s)`;
    $('tabCount').textContent = count;
  }

  function renderAppointments() {
    const container = $('eventsList');
    if (!state.appointments.length) {
      container.innerHTML = '<div class="notice info">Nenhum compromisso encontrado.</div>';
      return;
    }

    container.innerHTML = state.appointments.map(ev => {
      const [y, m, d] = ev.date.split('-');
      return `
        <div class="event-item">
          <div class="event-header">
            <span>${ev.title}</span>
            <span style="color:var(--primary)">${ev.duration}m</span>
          </div>
          <div class="event-meta">
            <div>🗓 ${d}/${m}/${y} às <b>${ev.time}</b></div>
            <div>👤 ${ev.clientName} · ${ev.clientPhone}</div>
            ${ev.notes ? `<div>📝 ${ev.notes}</div>` : ''}
          </div>
          <div class="event-btns">
            <button type="button" class="mini-btn" onclick="sendWhatsApp('${ev.id}')">💬 Enviar WhatsApp</button>
            <button type="button" class="mini-btn del" onclick="deleteEvent('${ev.id}')">✕</button>
          </div>
        </div>
      `;
    }).join('');
    scheduleResize();
  }

  $('scheduleForm').onsubmit = async (e) => {
    e.preventDefault();
    const newEv = {
      id: String(Date.now()),
      title: $('eventTitle').value,
      date: $('eventDate').value,
      time: $('eventTime').value,
      duration: $('eventDuration').value,
      email: $('eventEmail').value,
      notes: $('eventNotes').value,
      clientName: $('cust-name').textContent,
      clientPhone: $('cust-phone').textContent
    };

    state.appointments.unshift(newEv);
    localStorage.setItem('agenda_events', JSON.stringify(state.appointments));
    updateCounts();

    if (googleAccessToken) {
      const ok = await pushToGoogleCalendar(newEv);
      if (ok && state.hasOmni && omni.ui?.toast) {
        await omni.ui.toast('Agendado e sincronizado no Google Calendar!', 'success');
      }
    } else {
      if (state.hasOmni && omni.ui?.toast) {
        await omni.ui.toast('Salvo localmente. Conecte ao Google no topo.', 'warn');
      }
    }

    switchTab('list');
  };

  function deleteEvent(id) {
    state.appointments = state.appointments.filter(x => String(x.id) !== String(id));
    localStorage.setItem('agenda_events', JSON.stringify(state.appointments));
    updateCounts();
    renderAppointments();
  }

  async function sendWhatsApp(id) {
    const ev = state.appointments.find(x => String(x.id) === String(id));
    if (!ev) return;

    const [y, m, d] = ev.date.split('-');
    const msg = `📅 *Agendamento Confirmado!*\n\nOlá, ${ev.clientName}!\nSeu horário para *${ev.title}* está marcado:\n🗓 *Data:* ${d}/${m}/${y}\n⏰ *Horário:* ${ev.time}\n⏱ *Duração:* ${ev.duration} min\n\nQualquer dúvida, estamos à disposição!`;

    if (state.hasOmni && state.chat?.id) {
      try {
        await omni.chats.sendMessage(Number(state.chat.id), { text: msg });
        if (omni.ui?.toast) await omni.ui.toast('Mensagem enviada no chat!', 'success');
      } catch (err) {
        console.error(err);
      }
    }
  }

  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  $('eventDate').value = tomorrow.toISOString().split('T')[0];
  $('eventTime').value = '14:00';
  updateCounts();
  if (googleAccessToken) updateGoogleStatus(true);

  async function boot() {
    initGoogleAuth();
    if (!state.hasOmni) {
      $('sdk-state').textContent = 'Modo isolado';
      await refreshChat();
      scheduleResize();
      return;
    }

    $('sdk-state').textContent = 'Detectado';
    omni.ready(async () => {
      state.ready = true;
      $('sdk-state').textContent = 'Conectado';
      omni.on('chatListChanged', refreshChat);
      await refreshChat();
      scheduleResize();
    });
  }

  if ('ResizeObserver' in window) new ResizeObserver(scheduleResize).observe(document.body);
  setInterval(resizeHost, 2000);
  boot();
</script>
</body>
</html>
